name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Benchmarks
        run: go test -run '^$' -bench=. -benchmem ./...
